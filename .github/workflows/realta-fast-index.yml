name: realta-fast-index
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python run_realta_fast_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: realta-fast-results
          path: realta-fast-results.json
