name: realta-card-scan
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python run_realta_index_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: realta-card-results
          path: realta-results.json
